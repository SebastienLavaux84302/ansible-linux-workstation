---
- name: Vérifier la liste des dépôts Satellite demandés
  ansible.builtin.assert:
    that:
      - fpga_repos is sequence
      - fpga_repos is not string
      - fpga_repos is not mapping
      - (fpga_repos | select("string") | list | length) == (fpga_repos | length)
      - not (fpga_exclusive_repos | bool) or (fpga_repos | length > 0)
    fail_msg: >-
      fpga_repos doit être une liste d'ID DNF. Avec fpga_exclusive_repos=true,
      elle ne peut pas être vide.

- name: Lister tous les dépôts disponibles via subscription-manager
  ansible.builtin.command:
    argv: [subscription-manager, repos, --list]
  environment:
    LC_ALL: C
  register: fpga_subscription_available
  changed_when: false
  check_mode: false
  when: fpga_repos | length > 0

- name: Extraire les identifiants exacts des dépôts disponibles
  ansible.builtin.set_fact:
    fpga_subscription_available_ids: >-
      {%- set ns = namespace(ids=[]) -%}
      {%- for line in fpga_subscription_available.stdout_lines -%}
      {%- if line.strip().startswith('Repo ID:') -%}
      {%- set ns.ids = ns.ids + [line.split(':', 1)[1] | trim] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.ids }}
  when: fpga_repos | length > 0

- name: Vérifier que les dépôts demandés sont accessibles depuis Satellite
  ansible.builtin.assert:
    that:
      - fpga_repos | difference(fpga_subscription_available_ids) | length == 0
    fail_msg: >-
      Ces ID ne sont pas proposés par subscription-manager :
      {{ fpga_repos | difference(fpga_subscription_available_ids) | join(', ') }}.
      Vérifier les ID, la Content View, le cycle de vie et l'enregistrement de la machine.
    success_msg: Tous les dépôts demandés sont disponibles via subscription-manager.
  when: fpga_repos | length > 0

- name: Lister les dépôts Satellite déjà activés
  ansible.builtin.command:
    argv: [subscription-manager, repos, --list-enabled]
  environment:
    LC_ALL: C
  register: fpga_subscription_enabled_before
  changed_when: false
  check_mode: false
  when: fpga_repos | length > 0

- name: Extraire les identifiants exacts déjà activés
  ansible.builtin.set_fact:
    fpga_subscription_enabled_ids: >-
      {%- set ns = namespace(ids=[]) -%}
      {%- for line in fpga_subscription_enabled_before.stdout_lines -%}
      {%- if line.strip().startswith('Repo ID:') -%}
      {%- set ns.ids = ns.ids + [line.split(':', 1)[1] | trim] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.ids }}
  when: fpga_repos | length > 0

- name: Afficher les dépôts qui seraient activés en mode simulation
  ansible.builtin.debug:
    msg: "Dépôts à activer : {{ fpga_repos | difference(fpga_subscription_enabled_ids) }}"
  when:
    - ansible_check_mode
    - fpga_repos | length > 0

- name: Activer les dépôts Satellite manquants
  ansible.builtin.command:
    argv: [subscription-manager, repos, "--enable={{ item }}"]
  loop: "{{ fpga_repos }}"
  when:
    - not ansible_check_mode
    - item not in fpga_subscription_enabled_ids
  changed_when: true

- name: Contrôler les dépôts Satellite activés après modification
  ansible.builtin.command:
    argv: [subscription-manager, repos, --list-enabled]
  environment:
    LC_ALL: C
  register: fpga_subscription_enabled_after
  changed_when: false
  check_mode: false
  when:
    - not ansible_check_mode
    - fpga_repos | length > 0

- name: Vérifier que tous les dépôts demandés sont activés
  ansible.builtin.assert:
    that:
      - fpga_repos | difference(fpga_subscription_verified_ids) | length == 0
    fail_msg: >-
      Ces dépôts ne sont pas activés :
      {{ fpga_repos | difference(fpga_subscription_verified_ids) | join(', ') }}.
    success_msg: Tous les dépôts demandés sont activés.
  vars:
    fpga_subscription_verified_ids: >-
      {%- set ns = namespace(ids=[]) -%}
      {%- for line in fpga_subscription_enabled_after.stdout_lines -%}
      {%- if line.strip().startswith('Repo ID:') -%}
      {%- set ns.ids = ns.ids + [line.split(':', 1)[1] | trim] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.ids }}
  when:
    - not ansible_check_mode
    - fpga_repos | length > 0
