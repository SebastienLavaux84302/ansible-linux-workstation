# Personnalisation du bureau : activer après ajout des fichiers dans files/.
fpga_personnaliser_bureau: false
fpga_wallpaper_fichier: wallpaper.png
fpga_logo_fichier: logo.png
fpga_bureau_repertoire: /usr/share/backgrounds/custom
fpga_bureau_gestion_energie: true
fpga_bureau_desactiver_confirmation_deconnexion: true
fpga_bureau_verrouiller_animations: true
# Facultatif : définir les extensions GNOME par défaut pour les nouveaux profils.
# Cela remplace la liste système par défaut ; inclure toutes les extensions souhaitées.
fpga_bureau_definir_extensions_par_defaut: false
fpga_bureau_extensions_par_defaut:
  - background-logo@fedorahosted.org
