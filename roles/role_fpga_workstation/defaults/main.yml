---
# Exemples RHEL 9 x86_64 : remplacer par les identifiants visibles sur l'hôte.
# Ajouter, selon les besoins, les identifiants des dépôts complémentaires
# publiés et autorisés dans votre Satellite (EPEL, logiciels tiers, etc.).
fpga_repos:
  - rhel-9-for-x86_64-baseos-rpms
  - rhel-9-for-x86_64-appstream-rpms
# true : limite les transactions DNF à fpga_repos ; exige une liste non vide.
fpga_exclusive_repos: false
fpga_refresh_metadata: true
fpga_diagnostic_packages:
  - bash
  - firefox
  - vim-enhanced

fpga_install_gnome: true
fpga_gnome_group: "@Server with GUI"
fpga_gnome_packages:
  - gdm
  - gnome-shell
  - gnome-terminal
  - nautilus
  - firefox
  - evince
  - xorg-x11-server-Xorg
  - xorg-x11-drivers
  - xorg-x11-xauth
  - xorg-x11-fonts-Type1
fpga_install_devel_group: false
fpga_devel_group:
  - "@Development Tools"
fpga_install_xrdp: true
fpga_xrdp_packages:
  - xrdp
  - xrdp-selinux
fpga_configure_firewall: true
fpga_firewall_service: rdp
fpga_set_graphical_target: true
# Basculer immédiatement en mode graphique peut interrompre des services.
fpga_isolate_graphical_target: false
# true : affichage avant et après chaque paquet (transactions séparées).
# false : installation groupée en une seule transaction DNF.
fpga_package_progress: true
