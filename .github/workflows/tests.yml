name: Tests des dépôts Ansible

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installer Ansible Core
        run: python -m pip install ansible-core==2.16.14
      - name: Vérifier la syntaxe du playbook
        run: ansible-playbook -i inventories/example.yml playbooks/workstation.yml --syntax-check
      - name: Tester les dépôts avec subscription-manager simulé
        run: python -m unittest discover -s tests -v
